<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 | Mahadin Trader</title>
  <meta name="description" content="Page not found - Mahadin Trader Official Website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #070b14;
      color: #ffffff;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 45px 25px;
    }

    .error {
      font-size: clamp(90px, 25vw, 180px);
      font-weight: 900;
      line-height: 1;
      color: #00d9ff;
      text-shadow: 0 0 30px rgba(0, 217, 255, 0.25);
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 42px);
      margin-bottom: 15px;
    }

    p {
      color: #aeb8c8;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.3s;
    }

    .home {
      background: #00d9ff;
      color: #061018;
    }

    .home:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 217, 255, 0.25);
    }

    .social {
      border: 1px solid #273246;
      color: #ffffff;
      background: #101724;
    }

    .social:hover {
      transform: translateY(-3px);
      border-color: #00d9ff;
    }

    .brand {
      margin-top: 45px;
      color: #718096;
      font-size: 14px;
    }

    .brand strong {
      color: #00d9ff;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="error">404</div>

    <h1>Page Not Found</h1>

    <p>
      Sorry, the page you are looking for doesn't exist
      or may have been moved.
    </p>

    <div class="buttons">
      <a class="home" href="https://mahadintrader.github.io/">
        ← Back to Home
      </a>

      <a class="social" href="https://mahadintrader.github.io/#social">
        Social Media
      </a>
    </div>

    <div class="brand">
      © 2026 <strong>Mahadin Trader</strong>. All Rights Reserved.
    </div>

  </main>

</body>
</html>
